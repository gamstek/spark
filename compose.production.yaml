services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spark}
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-spark} -d ${POSTGRES_DB:-spark}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data

  api:
    image: ${SPARK_API_IMAGE:-spark-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: >-
      sh -c "node apps/api/dist/database/migrate.js && pnpm --filter @spark/api
      start"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      TRUST_PROXY: 172.16.0.0/12
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET is required}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      WECHAT_TOKEN_ENCRYPTION_KEY:
        ${WECHAT_TOKEN_ENCRYPTION_KEY:?WECHAT_TOKEN_ENCRYPTION_KEY is required}
      DINGTALK_CALLBACK_SECRET:
        ${DINGTALK_CALLBACK_SECRET:?DINGTALK_CALLBACK_SECRET is required}
      REDEEM_CODE_ACTIVE_KEY_ID:
        ${REDEEM_CODE_ACTIVE_KEY_ID:?REDEEM_CODE_ACTIVE_KEY_ID is required}
      REDEEM_CODE_KEYS: ${REDEEM_CODE_KEYS:?REDEEM_CODE_KEYS is required}
      MEDIA_ROOT: /var/lib/spark/media
      PRIVATE_EXPORT_ROOT: /var/lib/spark/exports
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-1000}
      MAINTENANCE_INTERVAL_MS: ${MAINTENANCE_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/var/lib/spark/media
      - exports:/var/lib/spark/exports

  web:
    image: ${SPARK_WEB_IMAGE:-spark-web:local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/usr/share/nginx/media:ro

volumes:
  database:
  media:
  exports:
