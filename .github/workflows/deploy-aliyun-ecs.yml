name: Deploy to Aliyun ECS

on:
  workflow_call:
    inputs:
      image_sha:
        description: Full Git commit SHA of the published images to deploy
        required: true
        type: string
      config_ref:
        description: Git ref containing the deployment configuration
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full Git commit SHA of the published images to deploy
        required: true
        type: string
      config_ref:
        description: Git ref containing the deployment configuration
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-aliyun-ecs
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/gamstek/spark
  DEPLOY_SHA: ${{ inputs.image_sha }}
  CONFIG_REF: ${{ inputs.config_ref || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CONFIG_REF }}
          persist-credentials: false

      - name: Validate deployment inputs
        env:
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          ECS_HEALTHCHECK_URL: ${{ secrets.ECS_HEALTHCHECK_URL }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "image_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          }
          [[ "$ECS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "ECS_DEPLOY_PATH must be a safe absolute path" >&2
            exit 1
          }
          [[ "$ECS_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "ECS_PORT must be a valid port number" >&2
            exit 1
          }
          [[ -z "$ECS_HEALTHCHECK_URL" || "$ECS_HEALTHCHECK_URL" == https://* ]] || {
            echo "ECS_HEALTHCHECK_URL must use HTTPS" >&2
            exit 1
          }
          for name in ECS_HOST ECS_PASSWORD ECS_SSH_KNOWN_HOSTS ECS_USER; do
            [[ -n "${!name}" ]] || {
              echo "Required production secret $name is missing" >&2
              exit 1
            }
          done

      - name: Install password SSH client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass

      - name: Configure SSH
        env:
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare release configuration
        run: |
          set -euo pipefail
          cat > .env.release <<EOF
          SPARK_API_IMAGE=${IMAGE_PREFIX}-api:sha-${DEPLOY_SHA}
          SPARK_WEB_IMAGE=${IMAGE_PREFIX}-web:sha-${DEPLOY_SHA}
          EOF

      - name: Upload deployment configuration
        env:
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          SSHPASS: ${{ secrets.ECS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" \
            "mkdir -p -- '$ECS_DEPLOY_PATH'"
          sshpass -e scp -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -P "$ECS_PORT" compose.production.yaml .env.release \
            "$ECS_USER@$ECS_HOST:$ECS_DEPLOY_PATH/"

      - name: Deploy release
        env:
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          SSHPASS: ${{ secrets.ECS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" \
            "sh -s -- '$ECS_DEPLOY_PATH'" <<'REMOTE'
          set -eu
          cd "$1"
          compose() {
            docker compose --env-file .env.production \
              --env-file .env.release -f compose.production.yaml "$@"
          }
          compose pull api web
          compose up -d --no-build --remove-orphans
          compose ps
          attempt=0
          until curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/health/ready; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then
              echo "Local readiness check failed after 20 attempts" >&2
              exit 1
            fi
            sleep 3
          done
          REMOTE

      - name: Check production readiness
        env:
          ECS_HEALTHCHECK_URL: ${{ secrets.ECS_HEALTHCHECK_URL }}
        run: |
          if [[ -z "$ECS_HEALTHCHECK_URL" ]]; then
            echo "External HTTPS readiness check is not configured yet"
            exit 0
          fi
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 3 --retry-connrefused \
            "$ECS_HEALTHCHECK_URL"
