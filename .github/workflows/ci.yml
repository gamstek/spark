name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spark_test
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark -d spark_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://spark:spark_test@127.0.0.1:5432/spark_test
      TEST_DATABASE_URL: postgresql://spark:spark_test@127.0.0.1:5432/spark_test
      PUBLIC_ORIGIN: http://127.0.0.1:4173
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-bytes
      OAUTH_STATE_SECRET: ci-oauth-secret-with-at-least-32-bytes
      WECHAT_TOKEN_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spark/api db:migrate
      - run: pnpm --filter @spark/api templates:check
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/admin.spec.ts
