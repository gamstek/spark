name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @spark/api templates:check; pnpm lint; pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spark_test
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark -d spark_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://spark:spark_test@127.0.0.1:5432/spark_test
      PUBLIC_ORIGIN: http://127.0.0.1:4173
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-bytes
      OAUTH_STATE_SECRET: ci-oauth-secret-with-at-least-32-bytes
      WECHAT_TOKEN_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @spark/api db:migrate; pnpm test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spark_test
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark -d spark_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://spark:spark_test@127.0.0.1:5432/spark_test
      PUBLIC_ORIGIN: http://127.0.0.1:4173
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-bytes
      OAUTH_STATE_SECRET: ci-oauth-secret-with-at-least-32-bytes
      WECHAT_TOKEN_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @spark/api db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test tests/e2e/admin.spec.ts
          tests/e2e/activity-upload.spec.ts tests/e2e/stock-retry.spec.ts
