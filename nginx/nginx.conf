limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=5r/s;

set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $spark_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  client_max_body_size 7m;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /api {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params;
  }

  location /media/ {
    root /usr/share/nginx;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ ^/api/(admin/auth/login|staff/auth/login|wechat/oauth) {
    limit_req zone=api_sensitive burst=5 nodelay;
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params;
  }

  location = /activity {
    return 308 /activity/;
  }

  location /activity/ {
    try_files $uri $uri/ /activity/index.html;
  }

  location = /staff {
    return 308 /staff/;
  }

  location /staff/ {
    try_files $uri $uri/ /staff/index.html;
  }

  location = /admin {
    return 308 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location = / {
    return 302 /activity/;
  }
}
