services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spark_test
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - spark-postgres:/var/lib/postgresql

volumes:
  spark-postgres:
